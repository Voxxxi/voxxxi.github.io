
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOXi — Студия звукозаписи</title>
</head>
<body>

    <h1>VOXi</h1>
    <p>Студия звукозаписи</p>
    <hr>

    <h2>Запись на студию</h2>

    <form id="bookingForm">
        <label>Имя и фамилия:</label><br>
        <input type="text" id="name" required><br><br>

        <label>Номер телефона:</label><br>
        <input type="tel" id="phone" required><br><br>

        <label>Дата записи:</label><br>
        <input type="date" id="date" required><br><br>

        <label>Время записи:</label><br>
        <input type="time" id="time" required><br><br>

        <label>Количество человек:</label><br>
        <input type="number" id="people" min="1" value="1" required><br><br>

        <label>Количество песен:</label><br>
        <input type="number" id="songs" min="1" value="1" required><br><br>

        <label>Названия песен:</label><br>
        <textarea id="songNames" rows="3"></textarea><br><br>

        <h3>Стоимость: <span id="price">5000</span> ₸</h3>
        <button type="submit">Создать заявку</button>
    </form>

    <hr>

    <h2>Резервное копирование</h2>
    <button type="button" id="exportButton">
        Скачать резервную копию
    </button>

    <br><br>

    <label for="backupFile">Восстановить заявки из файла:</label><br>
    <input type="file" id="backupFile" accept=".json,application/json">

    <hr>

    <h2>Мои заявки</h2>
    <div id="bookings"></div>

    <script>
        const people = document.getElementById("people");
        const songs = document.getElementById("songs");
        const price = document.getElementById("price");
        const form = document.getElementById("bookingForm");
        const bookings = document.getElementById("bookings");

        function calculatePrice() {
            const count = Number(people.value);
            const songCount = Number(songs.value);
            let total = 0;

            if (count === 1) total = 5000;
            else if (count === 2) total = 6000;
            else if (count === 3) total = 7000;
            else if (count >= 4) total = count * 2000;

            price.textContent = total * songCount;
        }

        function getSaved() {
            return JSON.parse(
                localStorage.getItem("voxiBookings") || "[]"
            );
        }

        function saveAll(data) {
            localStorage.setItem("voxiBookings", JSON.stringify(data));
        }

        people.addEventListener("input", calculatePrice);
        songs.addEventListener("input", calculatePrice);

        form.addEventListener("submit", function(event) {
            event.preventDefault();

            const saved = getSaved();

            saved.push({
                id: Date.now().toString(),
                name: document.getElementById("name").value,
                phone: document.getElementById("phone").value,
                date: document.getElementById("date").value,
                time: document.getElementById("time").value,
                people: people.value,
                songs: songs.value,
                songNames: document.getElementById("songNames").value,
                price: price.textContent,
                status: "Запланировано"
            });

            saveAll(saved);
            showBookings();
            form.reset();
            calculatePrice();

            alert("Заявка сохранена!");
        });

        function changeStatus(id, status) {
            const saved = getSaved();
            const item = saved.find(booking => booking.id === id);

            if (item) {
                item.status = status;
                saveAll(saved);
                showBookings();
            }
        }

        function deleteBooking(id) {
            if (!confirm("Точно удалить заявку? Это действие нельзя отменить.")) {
                return;
            }

            const saved = getSaved().filter(booking => booking.id !== id);
            saveAll(saved);
            showBookings();
        }

        function showBookings() {
            const saved = getSaved();
            bookings.innerHTML = "";

            if (saved.length === 0) {
                bookings.textContent = "Пока заявок нет.";
                return;
            }

            saved.forEach(function(item, index) {
                const card = document.createElement("div");
                card.style.border = "1px solid #999";
                card.style.padding = "12px";
                card.style.marginBottom = "12px";

                const title = document.createElement("h3");
                title.textContent = "Заявка №" + (index + 1);
                card.appendChild(title);

                const details = document.createElement("p");
                details.textContent =
                    "Клиент: " + item.name +
                    " | Телефон: " + item.phone +
                    " | Дата: " + item.date +
                    " | Время: " + item.time +
                    " | Человек: " + item.people +
                    " | Песен: " + item.songs +
                    " | Названия: " + item.songNames +
                    " | Сумма: " + item.price + " ₸";
                card.appendChild(details);

                const label = document.createElement("label");
                label.textContent = "Статус заказа: ";
                card.appendChild(label);

                const select = document.createElement("select");

                [
                    "Запланировано",
                    "В процессе",
                    "Записано",
                    "Готово",
                    "Отменено"
                ].forEach(function(status) {
                    const option = document.createElement("option");
                    option.value = status;
                    option.textContent = status;
                    select.appendChild(option);
                });

                select.value = item.status || "Запланировано";
                select.addEventListener("change", function() {
                    changeStatus(item.id, select.value);
                });

                card.appendChild(select);

                const deleteButton = document.createElement("button");
                deleteButton.textContent = "Удалить заявку";
                deleteButton.style.marginLeft = "10px";
                deleteButton.addEventListener("click", function() {
                    deleteBooking(item.id);
                });

                card.appendChild(deleteButton);
                bookings.appendChild(card);
            });
        }

        document.getElementById("exportButton").addEventListener("click", function() {
            const data = getSaved();
            const file = new Blob(
                [JSON.stringify(data, null, 2)],
                { type: "application/json" }
            );

            const url = URL.createObjectURL(file);
            const link = document.createElement("a");
            link.href = url;
            link.download = "VOXi-backup.json";
            link.click();
            URL.revokeObjectURL(url);

            alert("Резервная копия подготовлена. Проверь папку «Загрузки».");
        });

        document.getElementById("backupFile").addEventListener("change", async function(event) {
            const file = event.target.files[0];
            if (!file) return;

            try {
                const text = await file.text();
                const imported = JSON.parse(text);

                if (
                    !Array.isArray(imported) ||
                    !imported.every(item =>
                        item &&
                        typeof item === "object" &&
                        !Array.isArray(item) &&
                        typeof item.name === "string" &&
                        typeof item.phone === "string" &&
                        typeof item.date === "string" &&
                        typeof item.time === "string" &&
                        Number.isFinite(Number(item.people)) &&
                        Number.isFinite(Number(item.songs)) &&
                        Number.isFinite(Number(item.price))
                    )
                ) {
                    throw new Error("Неподходящий формат резервной копии.");
                }

                if (!confirm(
                    "Восстановить " + imported.length +
                    " заявок? Текущий список будет заменён. Сначала скачай копию текущих заявок."
                )) {
                    event.target.value = "";
                    return;
                }

                const cleaned = imported.map(item => ({
                    id: String(item.id || (
                        Date.now().toString() + Math.random().toString(36).slice(2)
                    )),
                    name: item.name,
                    phone: item.phone,
                    date: item.date,
                    time: item.time,
                    people: String(item.people),
                    songs: String(item.songs),
                    songNames: String(item.songNames || ""),
                    price: String(item.price),
                    status: [
                        "Запланировано",
                        "В процессе",
                        "Записано",
                        "Готово",
                        "Отменено"
                    ].includes(item.status) ? item.status : "Запланировано"
                }));

                saveAll(cleaned);
                showBookings();
                alert("Заявки восстановлены!");
            } catch (error) {
                alert("Не удалось восстановить файл. Выбери резервную копию VOXi в формате JSON.");
            }

            event.target.value = "";
        });

        calculatePrice();
        showBookings();
    </script>

</body>
</html>
