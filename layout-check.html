<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VOXi — проверка вёрстки</title><style>body{margin:0;background:#242122;color:#f3d39b;font:14px Manrope,Arial,sans-serif;text-align:center}header{padding:12px}h1{font-size:16px;margin:0 0 9px}p{font-size:12px;color:#c7bbb0}select,a{background:#161315;color:#f3d39b;border:1px solid #987749;border-radius:8px;padding:8px;margin:4px}main{overflow:auto;padding:0 12px 20px}iframe{display:block;width:390px;height:780px;border:1px solid #987749;border-radius:15px;margin:0 auto;background:#080808}</style></head><body><header><h1>VOXi · проверка адаптивной вёрстки</h1><label>Ширина <select id="width"><option value="390">390 px</option><option value="430">430 px</option><option value="768">768 px</option></select></label><label>Страница <select id="page"><option value="./">Главная</option><option value="cabinet.html">Кабинет</option><option value="admin.html?section=home">Админка</option><option value="admin.html?section=clients">Клиенты</option><option value="admin.html?section=income">Доходы</option><option value="admin.html?section=schedule">Расписание</option></select></label><a href="./">На сайт</a><p>Проверка ширины в браузере. Реальный телефон, клавиатура и установка приложения проверяются отдельно.</p></header><main><iframe id="preview" title="VOXi в окне выбранной ширины" src="about:blank"></iframe></main><script>const frame=document.getElementById('preview'),stamp=new URLSearchParams(location.search).get('v')||'layout-review';frame.src='./?v='+encodeURIComponent(stamp);document.getElementById('width').onchange=e=>{frame.style.width=e.target.value+'px'};document.getElementById('page').onchange=e=>{const url=new URL(e.target.value,location.href);url.searchParams.set('v',stamp);frame.src=url.href};</script></body></html>
